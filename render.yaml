services:
  - type: web
    name: prep-track-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prep-track-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: TOKEN_EXPIRE_MINUTES
        value: "10080"
databases:
  - name: prep-track-db
    databaseName: prep_track
    user: prep_track_user
